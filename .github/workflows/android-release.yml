name: Android release

# Manual only. Needs the four upload-keystore secrets in docs/mobile-builds.md.
# Does not run on pull requests, so a missing keystore does not fail CI.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build = signed AAB/APK; emulator-test = run the APK from apk_run_id on an API 34 emulator"
        type: choice
        options: [build, emulator-test]
        default: build
      apk_run_id:
        description: Run id that produced app-release-apk (emulator-test only)
        default: "41554693656"

jobs:
  bundleRelease:
    if: ${{ inputs.mode != 'emulator-test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Write upload keystore and key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || { echo "Missing secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "${ANDROID_KEY_ALIAS}" || { echo "Missing secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD}" || { echo "Missing secret ANDROID_KEY_PASSWORD"; exit 1; }
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/kidease-upload.jks
          python3 - << 'PY'
          import os
          from pathlib import Path
          def field(value: str) -> str:
              return value.replace("\\", "\\\\").replace("\n", "").replace("=", "\\=")
          lines = [
              "storeFile=" + os.environ["GITHUB_WORKSPACE"] + "/android/kidease-upload.jks",
              "storePassword=" + field(os.environ["ANDROID_KEYSTORE_PASSWORD"]),
              "keyAlias=" + field(os.environ["ANDROID_KEY_ALIAS"]),
              "keyPassword=" + field(os.environ["ANDROID_KEY_PASSWORD"]),
          ]
          Path("android/key.properties").write_text("\n".join(lines) + "\n")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx cap sync android
      - name: bundleRelease
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew bundlePlayRelease assemblePlayRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/play/release/*.apk
          if-no-files-found: error

  emulator:
    if: ${{ inputs.mode == 'emulator-test' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: apk
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run emulator test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          REVIEWER_ACCOUNT_PASSWORD: ${{ secrets.REVIEWER_ACCOUNT_PASSWORD }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: APK=$(ls apk/*.apk | head -1) OUT=e2e-out bash scripts/android-e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-test
          path: e2e-out/
