name: Android release

# Manual only. Needs the four upload-keystore secrets in docs/mobile-builds.md.
# Does not run on pull requests, so a missing keystore does not fail CI.
on:
  workflow_dispatch:

jobs:
  bundleRelease:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Write upload keystore and key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || { echo "Missing secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "${ANDROID_KEY_ALIAS}" || { echo "Missing secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD}" || { echo "Missing secret ANDROID_KEY_PASSWORD"; exit 1; }
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/kidease-upload.jks
          python3 - << 'PY'
          import os
          from pathlib import Path
          def field(value: str) -> str:
              return value.replace("\\", "\\\\").replace("\n", "").replace("=", "\\=")
          lines = [
              "storeFile=" + os.environ["GITHUB_WORKSPACE"] + "/android/kidease-upload.jks",
              "storePassword=" + field(os.environ["ANDROID_KEYSTORE_PASSWORD"]),
              "keyAlias=" + field(os.environ["ANDROID_KEY_ALIAS"]),
              "keyPassword=" + field(os.environ["ANDROID_KEY_PASSWORD"]),
          ]
          Path("android/key.properties").write_text("\n".join(lines) + "\n")
          PY
      - name: Huawei AppGallery config
        env:
          AGCONNECT_SERVICES_JSON: ${{ secrets.AGCONNECT_SERVICES_JSON }}
          HUAWEI_VERSION_CODE: ${{ vars.HUAWEI_VERSION_CODE }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ.get("AGCONNECT_SERVICES_JSON", "").strip()
          dest = Path("android/app/src/huawei/agconnect-services.json")
          if not raw:
              print("AGCONNECT_SERVICES_JSON is not set. HMS plugin stays off. The build still succeeds.")
          else:
              dest.write_bytes(base64.b64decode(raw, validate=True))
              print("Wrote agconnect-services.json")
          code = os.environ.get("HUAWEI_VERSION_CODE", "").strip()
          if code:
              print("HUAWEI_VERSION_CODE is set")
          else:
              print("HUAWEI_VERSION_CODE is not set. Huawei versionCode stays 3.")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx cap sync android
      - name: bundleRelease
        working-directory: android
        env:
          HUAWEI_VERSION_CODE: ${{ vars.HUAWEI_VERSION_CODE }}
        run: chmod +x ./gradlew && ./gradlew bundlePlayRelease bundleHuaweiRelease assembleHuaweiRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: app-huawei-release-aab
          path: android/app/build/outputs/bundle/huaweiRelease/app-huawei-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: app-huawei-release-apk
          path: android/app/build/outputs/apk/huawei/release/app-huawei-release.apk
          if-no-files-found: error
