name: Android release

# Manual only. Needs the four upload-keystore secrets in docs/mobile-builds.md.
# Does not run on pull requests, so a missing keystore does not fail CI.
# The Play app-release-aab artifact is uploaded first. The same keystore then
# signs assembleAmazonRelease, uploaded as app-amazon-release, before Huawei.
# A missing AGCONNECT_SERVICES_JSON secret skips the Huawei build with a warning.
on:
  workflow_dispatch:

jobs:
  bundleRelease:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Write upload keystore and key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || { echo "Missing secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "${ANDROID_KEY_ALIAS}" || { echo "Missing secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD}" || { echo "Missing secret ANDROID_KEY_PASSWORD"; exit 1; }
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/kidease-upload.jks
          python3 - << 'PY'
          import os
          from pathlib import Path
          def field(value: str) -> str:
              return value.replace("\\", "\\\\").replace("\n", "").replace("=", "\\=")
          lines = [
              "storeFile=" + os.environ["GITHUB_WORKSPACE"] + "/android/kidease-upload.jks",
              "storePassword=" + field(os.environ["ANDROID_KEYSTORE_PASSWORD"]),
              "keyAlias=" + field(os.environ["ANDROID_KEY_ALIAS"]),
              "keyPassword=" + field(os.environ["ANDROID_KEY_PASSWORD"]),
          ]
          Path("android/key.properties").write_text("\n".join(lines) + "\n")
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx cap sync android
      - name: Play bundle
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew bundlePlayRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
      # Same upload keystore as Play (key.properties from ANDROID_KEYSTORE_* above).
      - name: Amazon Appstore APK
        working-directory: android
        run: ./gradlew assembleAmazonRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-amazon-release
          path: android/app/build/outputs/apk/amazon/release/app-amazon-release.apk
          if-no-files-found: error
      - name: Check AppGallery services secret
        id: agconnect
        env:
          AGCONNECT_SERVICES_JSON: ${{ secrets.AGCONNECT_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${AGCONNECT_SERVICES_JSON}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Huawei skipped::AGCONNECT_SERVICES_JSON is missing. Skipping the Huawei release build. The Play app-release-aab and Amazon app-amazon-release artifacts are already uploaded."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Inject AppGallery services file
        if: success() && steps.agconnect.outputs.present == 'true'
        env:
          AGCONNECT_SERVICES_JSON: ${{ secrets.AGCONNECT_SERVICES_JSON }}
        run: node scripts/inject-agconnect-services.mjs
      - name: Huawei bundle and APK
        if: success() && steps.agconnect.outputs.present == 'true'
        working-directory: android
        run: ./gradlew bundleHuaweiRelease assembleHuaweiRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && steps.agconnect.outputs.present == 'true'
        with:
          name: app-huawei-release
          path: |
            android/app/build/outputs/bundle/huaweiRelease/*.aab
            android/app/build/outputs/apk/huawei/release/*.apk
          if-no-files-found: error
