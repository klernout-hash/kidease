name: Android test APK

# Test builds only. Runs on pushes to test-build/** branches (never on main or PRs).
# Builds the Play debug APK (debug-signed, installable by sideloading) and uploads it.
# Put a preview/test web origin in test-build-server-url.txt (optional) so the WebView
# loads that site instead of production; with no file the app loads www.kidease.ca.
# No secrets are used. Nothing is released.
on:
  push:
    branches:
      - "test-build/**"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Optional test web origin
        run: |
          if [ -f test-build-server-url.txt ]; then echo "CAP_SERVER_URL=$(head -n1 test-build-server-url.txt | tr -d '[:space:]')" >> "$GITHUB_ENV"; fi
      - run: npx cap sync android
      - name: Play debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assemblePlayDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kidease-play-debug-apk
          path: android/app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error
          retention-days: 7
