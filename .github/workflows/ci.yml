name: CI

# Pipeline fail-rate is not production CFR. Better Stack + /api/health
# (`signal: production_health`) are the deploy-health signal. See docs/uptime.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional long-lived preview URL (skips local build + vite preview)
        required: false
        type: string

# Cancel superseded PR/branch runs so overlapping agent pushes do not
# inflate GitHub Actions fail-rate (cancelled ≠ failure ≠ production CFR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npx eslint .
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    # Phone, tablet, fold, store, and desktop shots run after the smoke suite.
    # WebKit system packages can take most of a slow runner before those shots start.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright-version
        run: |
          version="$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx playwright install-deps chromium webkit; then
              exit 0
            fi
            echo "playwright install-deps failed (attempt ${attempt})"
            sleep $((attempt * 5))
          done
          exit 1
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 180 npx playwright install chromium webkit; then
              exit 0
            fi
            echo "playwright browser install failed (attempt ${attempt})"
            sleep $((attempt * 5))
          done
          exit 1
      - name: Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Smoke against BASE_URL or local preview
        timeout-minutes: 45
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
        run: |
          if [ -n "${BASE_URL}" ]; then
            export BROWSER_ALLOW_EXTERNAL_HOST=1
            npm run e2e
          else
            npm run build
            npm run e2e:preview
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore

  # Kyle marks this check required in GitHub branch protection. This file does not change that setting.
  signed-in-e2e:
    runs-on: ubuntu-latest
    # WebKit system packages can use most of a slow runner. Leave time for the suite.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright-version-signed
        run: |
          version="$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache-signed
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version-signed.outputs.version }}
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx playwright install-deps chromium webkit; then
              exit 0
            fi
            echo "playwright install-deps failed (attempt ${attempt})"
            sleep $((attempt * 5))
          done
          exit 1
      - name: Install Playwright browsers
        if: steps.playwright-cache-signed.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 180 npx playwright install chromium webkit; then
              exit 0
            fi
            echo "playwright browser install failed (attempt ${attempt})"
            sleep $((attempt * 5))
          done
          exit 1
      - name: Save Playwright browsers
        if: steps.playwright-cache-signed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version-signed.outputs.version }}
      - name: Build preview
        run: npm run build
      - name: Signed-in parent and daycare, English and French
        timeout-minutes: 40
        run: node scripts/e2e-smoke.mjs --start-preview --signed-in
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: signed-in-e2e-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore
