name: CI

# Pipeline fail-rate is not production CFR. Better Stack + /api/health
# (`signal: production_health`) are the deploy-health signal. See docs/uptime.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional long-lived preview URL (skips local build + vite preview)
        required: false
        type: string

# Cancel superseded PR/branch runs so overlapping agent pushes do not
# inflate GitHub Actions fail-rate (cancelled ≠ failure ≠ production CFR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npx eslint .
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    # Phone, tablet, fold, store, and desktop shots run after the smoke suite.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Smoke against BASE_URL or local preview
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
        run: |
          if [ -n "${BASE_URL}" ]; then
            export BROWSER_ALLOW_EXTERNAL_HOST=1
            npm run e2e
          else
            npm run build
            npm run e2e:preview
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore

  # Kyle marks this check required in GitHub branch protection. This file does not change that setting.
  signed-in-e2e:
    runs-on: ubuntu-latest
    # WebKit system packages can use most of a slow runner. Leave time for the suite.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build preview
        run: npm run build
      - name: Signed-in parent and daycare, English and French
        run: node scripts/e2e-smoke.mjs --start-preview --signed-in
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: signed-in-e2e-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore
