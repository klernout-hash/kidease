name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional long-lived preview URL (skips local build + vite preview)
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx eslint .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke against BASE_URL or local preview
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
        run: |
          if [ -n "${BASE_URL}" ]; then
            export BROWSER_ALLOW_EXTERNAL_HOST=1
            npm run e2e
          else
            npm run build
            npm run e2e:preview
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore
