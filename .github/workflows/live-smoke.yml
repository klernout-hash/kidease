name: Live smoke

# Public production check after a Vercel production deployment succeeds.
# On failure, rolls production back when VERCEL_TOKEN and VERCEL_PROJECT_ID
# are set as GitHub Actions secrets. Missing secrets skip the rollback and
# fail the job. This workflow does not change GitHub or Vercel settings.
on:
  deployment_status:
  workflow_dispatch:

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       contains(fromJSON('["Production","production"]'), github.event.deployment.environment))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe www.kidease.ca and roll back on failure
        env:
          SMOKE_BASE_URL: https://www.kidease.ca
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: node scripts/live-smoke.mjs
