<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1A3790" />
    <title>KidEase</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f6f3ee;
        color: #1c2438;
        font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
      }
      main {
        box-sizing: border-box;
        max-width: 28rem;
        margin: 0 auto;
        padding: calc(48px + env(safe-area-inset-top)) 24px 48px;
      }
      p.kicker {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #1a3790;
      }
      h1 {
        margin: 12px 0 0;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      p.lead {
        margin: 16px 0 0;
        color: #5c6578;
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 24px;
        padding: 0 20px;
        border-radius: 999px;
        background: #1a3790;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">KidEase</p>
      <h1>You’re offline</h1>
      <p class="lead">
        Chrome still works. Search and listings need a connection. Reconnect, then try again — or email
        support@kidease.ca.
      </p>
      <a href="/">Back to KidEase</a>
    </main>
  </body>
</html>
