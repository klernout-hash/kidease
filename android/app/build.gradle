apply plugin: 'com.android.application'

// Shared versionCode is defaultConfig below. scripts/bump-native-version.mjs updates that line.
// One store can use its own number: HUAWEI_VERSION_CODE=3 or -PhuaweiVersionCode=3
// (same names for play, samsung, and amazon). Huawei AppGallery starts at 3.
def storeVersionCodeOverride = { String flavor ->
    def envName = flavor.toUpperCase() + "_VERSION_CODE"
    def raw = System.getenv(envName)
    if (raw == null || raw.toString().trim().isEmpty()) {
        def prop = project.findProperty(flavor + "VersionCode")
        raw = prop == null ? null : prop.toString()
    }
    if (raw == null || raw.toString().trim().isEmpty()) return null
    def text = raw.toString().trim()
    if (!(text ==~ /[1-9][0-9]*/)) {
        throw new GradleException(envName + " must be a positive integer")
    }
    return text.toInteger()
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    testOptions {
        unitTests.returnDefaultValues = true
    }
    namespace = "ca.kidease.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    flavorDimensions += "store"
    productFlavors {
        play {
            dimension "store"
            buildConfigField "String", "STORE", "\"play\""
            isDefault = true
            buildConfigField "String", "STORE_UA_TOKEN", "\"\""
            def playCode = storeVersionCodeOverride("play")
            if (playCode != null) versionCode playCode
        }
        samsung {
            dimension "store"
            buildConfigField "String", "STORE", "\"samsung\""
            buildConfigField "String", "STORE_UA_TOKEN", "\"KidEaseStoreSamsung\""
            def samsungCode = storeVersionCodeOverride("samsung")
            if (samsungCode != null) versionCode samsungCode
        }
        huawei {
            dimension "store"
            buildConfigField "String", "STORE", "\"huawei\""
            buildConfigField "String", "STORE_UA_TOKEN", "\"KidEaseStoreHuawei\""
            def huaweiCode = storeVersionCodeOverride("huawei")
            versionCode(huaweiCode != null ? huaweiCode : 3)
        }
        amazon {
            dimension "store"
            buildConfigField "String", "STORE", "\"amazon\""
            buildConfigField "String", "STORE_UA_TOKEN", "\"KidEaseStoreAmazon\""
            def amazonCode = storeVersionCodeOverride("amazon")
            if (amazonCode != null) versionCode amazonCode
        }
    }
    defaultConfig {
        applicationId "ca.kidease.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

configurations.configureEach {
    exclude group: "com.google.firebase", module: "firebase-analytics"
    exclude group: "com.google.firebase", module: "firebase-analytics-ktx"
}

// AppGallery and Amazon Fire have no Play Services. Keep GMS, Play, and Firebase out of those flavours.
// Play and Samsung keep these libraries. Only the huawei* and amazon* classpaths drop them.
configurations.matching { cfg ->
    def name = cfg.name.toLowerCase()
    name.contains("huawei") || name.contains("amazon")
}.configureEach {
    exclude group: "com.google.android.gms", module: "play-services-location"
    exclude group: "com.google.android.play", module: "review"
    exclude group: "com.google.firebase", module: "firebase-messaging"
    exclude group: "com.google.android.gms"
    exclude group: "com.google.android.play"
    exclude group: "com.google.firebase"
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.credentials:credentials:$androidxCredentialsVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// capacitor.build.gradle adds every plugin to `implementation`.
// Geolocation and in-app review call Play Services. Play and Samsung keep them.
// Huawei does not, or the AppGallery binary still ships those libraries.
def storeGmsPlugins = [":capacitor-geolocation", ":capacitor-community-in-app-review", ":capacitor-push-notifications"]
configurations.implementation.dependencies.removeAll { dep ->
    storeGmsPlugins.contains(dep.properties.get("path"))
}
dependencies {
    playImplementation project(":capacitor-geolocation")
    playImplementation project(":capacitor-community-in-app-review")
    samsungImplementation project(":capacitor-geolocation")
    samsungImplementation project(":capacitor-community-in-app-review")
    playImplementation project(":capacitor-push-notifications")
    samsungImplementation project(":capacitor-push-notifications")
    // CallMessagingService (play/samsung source sets) extends FirebaseMessagingService directly;
    // the push plugin keeps firebase-messaging as an implementation dep, so expose it here.
    playImplementation "com.google.firebase:firebase-messaging:${rootProject.ext.has("firebaseMessagingVersion") ? rootProject.ext.firebaseMessagingVersion : "25.0.1"}"
    samsungImplementation "com.google.firebase:firebase-messaging:${rootProject.ext.has("firebaseMessagingVersion") ? rootProject.ext.firebaseMessagingVersion : "25.0.1"}"
    // HMS Push Kit. Huawei flavour only. Server send stays behind FEATURE_CALL_PUSH (off).
    huaweiImplementation "com.huawei.hms:push:${rootProject.ext.hmsPushVersion}"
    // Play Services credential provider. Huawei stays on the platform
    // Credential Manager only (Android 14+). Older AppGallery phones keep email sign-in.
    playImplementation "androidx.credentials:credentials-play-services-auth:$androidxCredentialsVersion"
    samsungImplementation "androidx.credentials:credentials-play-services-auth:$androidxCredentialsVersion"
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// AppGallery Connect reads android/app/src/huawei/agconnect-services.json.
// Apply the plugin only when that file exists (local copy or CI-decoded secret)
// so Play, Samsung, Amazon, and a Huawei build without the file still succeed.
def huaweiAgcJson = file("src/huawei/agconnect-services.json")
if (huaweiAgcJson.exists()) {
    apply plugin: "com.huawei.agconnect"
}

// Huawei has no Google Play Services. Skip the google-services task on that flavour
// so a Play google-services.json cannot be baked into the AppGallery bundle.
// AGC tasks stay on the huawei flavour. Other stores must not run them.
gradle.taskGraph.whenReady { graph ->
    graph.allTasks.each { task ->
        def name = task.name.toLowerCase()
        if ((name.contains("huawei") || name.contains("amazon")) && name.contains("googleservices")) {
            task.enabled = false
        }
        if (name.contains("agconnect") && !name.contains("huawei")) {
            task.enabled = false
        }
    }
}
